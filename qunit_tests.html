<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QUnit Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/qunit/2.24.1/qunit.css" />
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qunit/2.24.1/qunit.min.js"></script>

    <script>
      // code under test
      function add(a, b) {
        return a + b;
      }

      // tests
      QUnit.module("Math");
      QUnit.test("add()", (assert) => {
        assert.equal(add(2, 3), 5, "2 + 3 = 5");
        // assert.equal(add(0, 3), 4, "0 + 3 = 4");
        assert.equal(add(0, 0), 0, "0 + 0 = 0");
      });
    </script>
  </body>
</html>
